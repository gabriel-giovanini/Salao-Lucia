<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Ilustração: pote de máscara hidratante preto com tampa ao lado">
  <defs>
    <linearGradient id="jar" x1="0" x2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset=".14" stop-color="#2b2b2b"/>
      <stop offset=".24" stop-color="#121212"/>
      <stop offset=".62" stop-color="#0a0a0a"/>
      <stop offset=".86" stop-color="#262626"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset=".5" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="cream" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f3eee8"/>
      <stop offset="1" stop-color="#cfc6bb"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3ad"/>
      <stop offset=".35" stop-color="#d4a752"/>
      <stop offset=".6" stop-color="#fbe9b9"/>
      <stop offset="1" stop-color="#a87a2c"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#8f6824"/>
      <stop offset=".3" stop-color="#e8c47a"/>
      <stop offset=".55" stop-color="#fff0c8"/>
      <stop offset=".8" stop-color="#d4a752"/>
      <stop offset="1" stop-color="#7e5a1c"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" x2="1">
      <stop offset="0" stop-color="#030303"/>
      <stop offset=".2" stop-color="#2e2e2e"/>
      <stop offset=".45" stop-color="#0e0e0e"/>
      <stop offset=".85" stop-color="#202020"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="lidTop" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="jarClip"><path d="M150 330 V585 Q150 640 400 640 Q650 640 650 585 V330 Z"/></clipPath>
  </defs>

  <!-- sombra no chão -->
  <ellipse cx="450" cy="660" rx="360" ry="34" fill="#000" opacity=".55" filter="url(#soft)"/>

  <!-- tampa (atrás, à direita) -->
  <!-- tampa apoiada no chão, atrás e à direita do pote -->
  <ellipse cx="700" cy="628" rx="170" ry="22" fill="#000" opacity=".5" filter="url(#soft)"/>
  <g transform="translate(540 470)">
    <path d="M0 50 V120 Q0 160 160 160 Q320 160 320 120 V50 Z" fill="url(#lid)"/>
    <ellipse cx="160" cy="50" rx="160" ry="42" fill="url(#lidTop)"/>
    <ellipse cx="160" cy="50" rx="160" ry="42" fill="none" stroke="#4a4a4a" stroke-opacity=".6" stroke-width="2"/>
    <ellipse cx="160" cy="50" rx="120" ry="28" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="10"/>
    <rect x="236" y="58" width="16" height="96" fill="url(#spec)" opacity=".7"/>
  </g>

  <!-- corpo do pote -->
  <path d="M150 330 V585 Q150 640 400 640 Q650 640 650 585 V330 Z" fill="url(#jar)"/>
  <g clip-path="url(#jarClip)">
    <rect x="205" y="300" width="34" height="360" fill="url(#spec)"/>
    <rect x="560" y="300" width="14" height="360" fill="url(#spec)" opacity=".6"/>
    <!-- textos -->
    <text x="400" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="14" fill="#d9c08a">MOMENTS</text>
    <text x="400" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="18" fill="url(#gold)">MASK</text>
    <rect x="200" y="548" width="400" height="34" rx="4" fill="url(#band)"/>
    <text x="400" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="7" fill="#1a1206">MÁSCARA HIDRATANTE</text>
  </g>

  <!-- borda superior + creme -->
  <ellipse cx="400" cy="330" rx="250" ry="58" fill="url(#rim)"/>
  <ellipse cx="400" cy="326" rx="226" ry="46" fill="#0a0a0a"/>
  <ellipse cx="400" cy="332" rx="214" ry="40" fill="url(#cream)"/>
  <path d="M300 330 C 340 300, 400 345, 440 315 S 520 325, 500 338" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <path d="M330 345 C 380 330, 430 352, 470 340" fill="none" stroke="#d8d0c6" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="400" cy="330" rx="250" ry="58" fill="none" stroke="#555" stroke-opacity=".45" stroke-width="2"/>
</svg>
