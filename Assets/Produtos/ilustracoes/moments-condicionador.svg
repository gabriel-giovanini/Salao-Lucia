<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 940" role="img" aria-label="Ilustração: frasco de condicionador branco e verde com válvula pump">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#b9bfc0"/>
      <stop offset=".16" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#f4f6f6"/>
      <stop offset=".7" stop-color="#e6e9e9"/>
      <stop offset=".9" stop-color="#c9cecf"/>
      <stop offset="1" stop-color="#a9afb0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#063c35"/>
      <stop offset=".18" stop-color="#1fa08e"/>
      <stop offset=".35" stop-color="#18907f"/>
      <stop offset=".75" stop-color="#0f6c60"/>
      <stop offset="1" stop-color="#05322c"/>
    </linearGradient>
    <linearGradient id="black" x1="0" x2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".3" stop-color="#3a3a3a"/>
      <stop offset=".55" stop-color="#111"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badge" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#b8f2e6"/>
      <stop offset="1" stop-color="#3fbfa8"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clip"><path d="M120 330 Q120 290 170 270 Q205 256 205 230 H315 Q315 256 350 270 Q400 290 400 330 V835 Q400 870 365 870 H155 Q120 870 120 835 Z"/></clipPath>
  </defs>

  <ellipse cx="260" cy="885" rx="200" ry="24" fill="#000" opacity=".55" filter="url(#soft)"/>

  <!-- válvula pump -->
  <path d="M252 120 H268 V200 H252 Z" fill="url(#black)"/>
  <path d="M190 92 Q190 78 205 78 H300 Q315 78 315 92 V120 H190 Z" fill="url(#black)"/>
  <path d="M190 84 H110 Q96 84 96 96 Q96 104 104 104 H190 Z" fill="url(#black)"/>
  <rect x="205" y="82" width="10" height="34" fill="#fff" opacity=".18"/>
  <path d="M196 180 H324 V236 H196 Z" fill="url(#black)"/>
  <g stroke="#000" stroke-opacity=".5" stroke-width="2"><line x1="196" y1="196" x2="324" y2="196"/><line x1="196" y1="212" x2="324" y2="212"/></g>
  <rect x="212" y="180" width="10" height="56" fill="#fff" opacity=".15"/>

  <!-- frasco -->
  <path d="M120 330 Q120 290 170 270 Q205 256 205 230 H315 Q315 256 350 270 Q400 290 400 330 V835 Q400 870 365 870 H155 Q120 870 120 835 Z" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <!-- faixa verde com onda -->
    <path d="M100 560 C 180 520, 260 600, 420 540 V900 H100 Z" fill="url(#teal)"/>
    <path d="M100 560 C 180 520, 260 600, 420 540" fill="none" stroke="#7fe0cd" stroke-width="3" opacity=".7"/>
    <!-- selo -->
    <circle cx="260" cy="640" r="62" fill="url(#badge)" opacity=".95"/>
    <circle cx="260" cy="640" r="62" fill="none" stroke="#e8fffa" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="260" y="647" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#05463e">Hidratação</text>
    <!-- logo -->
    <g transform="translate(260 340)" fill="#1b1b1b">
      <path d="M0 -40 L5 -6 H12 L4 2 L16 34 H8 Q0 18 -8 34 H-16 L-4 2 L-12 -6 H-5 Z"/>
    </g>
    <text x="260" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="34" letter-spacing="5" fill="#1b1b1b">MOMENTS</text>
    <text x="260" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#1b1b1b">— paris —</text>
    <text x="260" y="755" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="3" fill="#ffffff">CONDICIONADOR</text>
    <text x="260" y="785" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#cdf3ea">NUTRIÇÃO · BRILHO · MACIEZ</text>
    <text x="260" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e6fffa">300 ml</text>
    <!-- reflexos -->
    <rect x="150" y="250" width="26" height="640" fill="url(#spec)"/>
    <rect x="350" y="300" width="10" height="560" fill="url(#spec)" opacity=".5"/>
  </g>
</svg>
