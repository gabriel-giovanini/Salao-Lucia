<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 980" role="img" aria-label="Ilustração: frasco grande dourado de condicionador com válvula pump">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#8f7146"/>
      <stop offset=".14" stop-color="#f8ead0"/>
      <stop offset=".28" stop-color="#ecd7b0"/>
      <stop offset=".7" stop-color="#dcc196"/>
      <stop offset=".9" stop-color="#b8996a"/>
      <stop offset="1" stop-color="#7d6039"/>
    </linearGradient>
    <linearGradient id="black" x1="0" x2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".3" stop-color="#3a3a3a"/>
      <stop offset=".55" stop-color="#111"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3d18"/>
      <stop offset="1" stop-color="#2e1d08"/>
    </linearGradient>
    <linearGradient id="goldInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a3c"/>
      <stop offset=".5" stop-color="#e9c47c"/>
      <stop offset="1" stop-color="#8c6223"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip"><path d="M110 360 Q110 300 180 280 Q225 266 225 236 H335 Q335 266 380 280 Q450 300 450 360 V880 Q450 920 410 920 H150 Q110 920 110 880 Z"/></clipPath>
  </defs>

  <ellipse cx="280" cy="935" rx="230" ry="26" fill="#000" opacity=".55" filter="url(#soft)"/>

  <!-- pump -->
  <path d="M271 120 H289 V205 H271 Z" fill="url(#black)"/>
  <path d="M206 92 Q206 76 222 76 H330 Q346 76 346 92 V122 H206 Z" fill="url(#black)"/>
  <path d="M206 84 H118 Q102 84 102 97 Q102 106 111 106 H206 Z" fill="url(#black)"/>
  <rect x="222" y="80" width="10" height="38" fill="#fff" opacity=".18"/>
  <path d="M214 186 H346 V242 H214 Z" fill="url(#black)"/>
  <g stroke="#000" stroke-opacity=".5" stroke-width="2"><line x1="214" y1="202" x2="346" y2="202"/><line x1="214" y1="220" x2="346" y2="220"/></g>

  <!-- frasco -->
  <path d="M110 360 Q110 300 180 280 Q225 266 225 236 H335 Q335 266 380 280 Q450 300 450 360 V880 Q450 920 410 920 H150 Q110 920 110 880 Z" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <circle cx="280" cy="400" r="26" fill="none" stroke="url(#goldInk)" stroke-width="3"/>
    <text x="280" y="409" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="url(#goldInk)">F</text>
    <text x="280" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="120" font-style="italic" fill="url(#ink)">fios</text>
    <text x="280" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-style="italic" fill="url(#ink)">hidratados</text>
    <rect x="170" y="625" width="220" height="2" fill="url(#goldInk)"/>
    <text x="280" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="5" fill="#4a3112">CONDICIONADOR</text>
    <text x="280" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6b4a22">HIDRATAÇÃO · MACIEZ · BRILHO</text>
    <text x="400" y="860" text-anchor="end" font-family="Georgia, serif" font-size="150" fill="url(#goldInk)">2</text>
    <text x="150" y="860" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#4a3112">2,5L</text>
    <rect x="140" y="270" width="30" height="660" fill="url(#spec)"/>
    <rect x="400" y="320" width="10" height="580" fill="url(#spec)" opacity=".45"/>
  </g>
</svg>
