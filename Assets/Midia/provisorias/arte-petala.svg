<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Arte abstrata provisória: flor de pétalas">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e2"/>
      <stop offset=".55" stop-color="#e2729d"/>
      <stop offset="1" stop-color="#6d1840"/>
    </linearGradient>
    <radialGradient id="c" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".5" stop-color="#f1c27a"/>
      <stop offset="1" stop-color="#9b6420"/>
    </radialGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9cc4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9cc4" stop-opacity="0"/>
    </radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <circle cx="300" cy="300" r="290" fill="url(#g)"/>
  <g transform="translate(300 300)" opacity=".95">
    <g id="ring">
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(45)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(90)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(135)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(180)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(225)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(270)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="url(#p)" opacity=".92" transform="rotate(315)"/>
    </g>
    <g transform="rotate(22.5) scale(.62)" opacity=".9">
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee"/>
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee" transform="rotate(60)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee" transform="rotate(120)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee" transform="rotate(180)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee" transform="rotate(240)"/>
      <ellipse rx="62" ry="150" cy="-118" fill="#ffe3ee" transform="rotate(300)"/>
    </g>
    <circle r="58" fill="url(#c)"/>
    <circle r="58" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <ellipse rx="22" ry="12" cx="-18" cy="-22" fill="#fff" opacity=".7" filter="url(#s)"/>
  </g>
</svg>
